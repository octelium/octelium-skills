# PostgreSQL behind Octelium with injected credentials.
# Before applying (value prompted, never stored here):  octeliumctl create secret <SECRET_NAME>
kind: Service
metadata:
  name: <SERVICE>
spec:
  mode: POSTGRES
  port: 5432
  config:
    upstream:
      url: postgres://<DB_HOST>:5432
    postgres:
      user: <DB_USER>
      database: <DB_NAME>
      auth:
        password:
          fromSecret: <SECRET_NAME>
      sslMode: VERIFY_FULL
  authorization:
    inlinePolicies:
      - spec:
          rules:
            - effect: ALLOW
              condition:
                match: '"<GROUP>" in ctx.user.spec.groups'
