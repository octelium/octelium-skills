kind: Workspace
spec:
  image:
    registry:
      url: node:24-bookworm
  repository:
    url: https://github.com/<ORG>/<REPO>
  vars:
    - name: TASK
      value: Fix the failing tests.
  runtime:
    autoStop: true
    envVars:
      - key: ANTHROPIC_BASE_URL
        value: http://<LLM_SERVICE>
      - key: ANTHROPIC_API_KEY
        value: unused
    tasks:
      - name: install-agent
        type: ON_CREATE
        workingDir: /workspace/repo
        run: npm install -g @anthropic-ai/claude-code
        onFailure: ON_FAILURE_ABORT
      - name: wait-for-llm
        type: POST_START
        workingDir: /workspace/repo
        run: timeout 120 sh -c 'until curl -s -o /dev/null "$ANTHROPIC_BASE_URL"; do sleep 2; done'
        onFailure: ON_FAILURE_ABORT
      - name: agent
        type: POST_START
        workingDir: /workspace/repo
        run: claude -p "${{ vars.TASK }}"
        onFailure: ON_FAILURE_ABORT
  limit:
    cpu:
      millicores: 2000
    memory:
      megabytes: 4096
    storage:
      megabytes: 20000
